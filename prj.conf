CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=0
# The vendor bootloader enters the application with interrupts masked (PRIMASK).
CONFIG_INIT_ARCH_HW_AT_BOOT=y
CONFIG_FLASH_LOAD_OFFSET=0x8000
# 0x08008000..0x0801F000; the settings partition follows, see the board's devicetree.
CONFIG_FLASH_LOAD_SIZE=0x17000
CONFIG_BUILD_OUTPUT_BIN=y
# Application logic is C++20; Zephyr builds it without exceptions and RTTI.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
# USB serial port: console and host protocol.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_PRINTK=y
# Restart into the vendor USB updater on request, see src/updater_entry.c.
CONFIG_UPDATER_ENTRY=y
# Settings records in the partition at the top of the application flash.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
